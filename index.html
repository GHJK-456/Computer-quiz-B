誌檔。"}, "page": 36}, {"number": 7, "answer": [4], "question": "下列敘述中何者不合乎資訊安全之概念？", "options": {"1": "設定檔案存取權限，如只允許讀取，不准寫入", "2": "設定檔案密碼保 護，只有擁有密碼之人才得以使用", "3": "隨時將檔案備份，以備檔案資料被破壞時可回存使用", "4": "設定檔案資料公 開，任何人皆可以使用。"}, "page": 36}, {"number": 8, "answer": [1], "question": "在國民身分證號碼的設計中，最後一碼為檢查碼，請問這種設計在應用系統控制方面屬於哪一種控制？", "options": {"1": "處 理控制", "2": "資料檔案控制", "3": "輸入控制", "4": "輸出控制。"}, "page": 36}, {"number": 9, "answer": [2], "question": "電腦化作業之後，通常會將檔案複製三份，而且分散存放在不同建築物內，這種做法在應用系統控制方面屬 於哪一種控制？", "options": {"1": "處理控制", "2": "資料檔案控制", "3": "輸入控制", "4": "輸出控制。"}, "page": 36}, {"number": 10, "answer": [4], "question": "一般而言要達到完善之終端機安全管制措施，則必須完整做到", "options": {"1": "在終端機上加鎖，限制使用人員", "2": "經常派安 全人員追蹤考核", "3": "事前訂定防弊措施", "4": "事前訂定完善防弊措施，事後做追蹤考核，並將終端機配合主機系統 一起管制。"}, "page": 36}, {"number": 11, "answer": [4], "question": "有關「資訊安全中電子簽名保密技術」之描述下列何者正確？", "options": {"1": "電子簽名之技術不需解碼", "2": "若以設計問題的 方法而論，電子簽名較公開鑰匙密碼法簡便", "3": "電子簽名乃是採用光筆、滑鼠等工具簽名，以供辨識", "4": "電子簽 名乃是利用數字來代替票據必須由個人親自簽名的方法。"}, "page": 36}, {"number": 12, "answer": [4], "question": "下列有關「資訊安全中存取管制(Access Control)方法」之描述何者正確？", "options": {"1": "為求系統安全顧慮不可銜接電腦 網路", "2": "為求存取方便不需提供存取控制碼之設定", "3": "在系統存取時不必考慮安全問題", "4": "系統應該提供網路存 取控制碼之設定功能。"}, "page": 36}, {"number": 13, "answer": [1], "question": "下列有關「資訊安全中系統設備備援」之描述何者正確？", "options": {"1": "重要系統設備(含軟、硬體)必須有備援措施", "2": "備 援方法必須以 1:1 對應的方式才可", "3": "遠端備援方式由於需佔空間且人力支援不易，故不必考慮", "4": "備援需花費 更多費用，因此不必考慮備援。"}, "page": 37}, {"number": 14, "answer": [3], "question": "對於電腦及應用系統之備援措施，下列敘述何者為正確？", "options": {"1": "只需做軟體備援即可", "2": "只需做硬體備援即可", "3": "重 要電子資料必須存放防火櫃並分置不同地點", "4": "顧及製作權及版權，為求備援則購置雙套軟體即可。"}, "page": 37}, {"number": 15, "answer": [4], "question": "下列關於「防火牆」的敘述，何者有誤？", "options": {"1": "可以用軟體或硬體來實作防火牆", "2": "可以管制企業內外電腦相互之 間的資料傳輸", "3": "可以隔絕來自外部網路的攻擊性網路封包", "4": "無法封鎖來自內部網路的對外攻擊行為。"}, "page": 37}, {"number": 16, "answer": [3], "question": "為了避免資料庫破壞後無法回復，除了定期備份外，最重要還要做到下列哪項工作？", "options": {"1": "管制使用", "2": "人工記錄", "3": "隨時記錄變動日誌檔", "4": "修改程式。"}, "page": 37}, {"number": 17, "answer": [3], "question": "在做遠端資料傳輸時，為避免資料被竊取，我們可以採用何種保護措施？", "options": {"1": "將資料壓縮", "2": "將資料解壓縮", "3": "將 資料加密", "4": "將資料解密。"}, "page": 37}, {"number": 18, "answer": [4], "question": "下列有關「網路防火牆」之敘述，何者不正確？", "options": {"1": "外部防火牆無法防止內賊對內部的侵害", "2": "防火牆能管制封 包的流向", "3": "防火牆可以阻隔外部網路進入內部系統", "4": "防火牆可以防止任何病毒的入侵。"}, "page": 37}, {"number": 19, "answer": [2], "question": "完善的資訊安全系統，以足夠之關卡，防止使用者透過程式去存取不是他可以存取之資料，這種觀念為", "options": {"1": "監 視性", "2": "資料存取控制", "3": "獨立性", "4": "識別。"}, "page": 37}, {"number": 20, "answer": [1], "question": "下列何者是錯誤的「系統安全措施」？", "options": {"1": "系統操作者統一保管密碼", "2": "資料加密", "3": "密碼變更", "4": "公布之電子文件 設定成唯讀檔。"}, "page": 37}, {"number": 21, "answer": [1], "question": "若在使用個人電腦時，發現螢幕上有異常之反白、閃爍或電腦執行速度減慢等可能中毒之現象，此時使用者 應做何種處置比較適宜？", "options": {"1": "立即結束程式之執行，關掉電源，再以原版軟體開機", "2": "將可能中毒之檔案刪除", "3": "立即放入原版軟體並以 Ctrl+Alt+Del 重新開機", "4": "立即結束原程式之執行，並用解毒軟體解毒。"}, "page": 37}, {"number": 22, "answer": [3], "question": "Application Gateway 是用來限制對超過防火牆界限之服務，下列何者不是在 Internet 上普遍實作的 Application Gateway ？", "options": {"1": "Mail gateway", "2": "Proxy", "3": "Hub", "4": "Server filter。"}, "page": 37}, {"number": 23, "answer": [1], "question": "有關 RFC 1108 所說明之 IPSO(IP Security Options)之敘述下列何者不正確？", "options": {"1": "IPSO 是在網路通訊協定中之實 體層運作", "2": "IPSO 是美國國防部 DOD 所使用的一種安全性規格", "3": "運用 IPdatagram 標頭的變動長度 Options 欄 位標記出 datagram 所裝載資料之機密性", "4": "IPSO 之主要觀念為 datagram 安全性標記。"}, "page": 37}, {"number": 24, "answer": [3], "question": "關於「防火牆」之敘述，下列敘述何者不正確？", "options": {"1": "防火牆乃是過濾器(Filter)與 Gateway 的集合", "2": "防火牆用來 將可信賴的網路保護在一個區域性管理的安全範圍內", "3": "防火牆大量運用於區域網路中，無法運用於廣域網路", "4": "防火牆可用來將外界無法信賴之網路隔開。"}, "page": 37}, {"number": 25, "answer": [2], "question": "關於「非對稱式密碼系統」之敘述，下列何者不正確？", "options": {"1": "1976 年以後所發展出來之公開金匙密碼系統即是 屬於非對稱式密碼系統", "2": "非對稱式密碼系統之加密金匙及解密金匙都是可以公開的", "3": "屬於雙密匙系統", "4": "主 要特性是系統的安全分析簡單明暸,但加解密運算過程費時。"}, "page": 37}, {"number": 26, "answer": [4], "question": "在分散式開放系統下的安全管理系統中，下列何者不是該系統至少須具備之功能？", "options": {"1": "驗證(Authentication)", "2": "授權(Authorization)", "3": "稽查(Auditing)", "4": "回答(Answering)。"}, "page": 37}, {"number": 27, "answer": [3], "question": "下列何者不是資訊安全的防護措施？", "options": {"1": "備份軟體", "2": "採用合法軟體", "3": "小問題組合成大問題", "4": "可確認檔案的傳 輸。"}, "page": 37}, {"number": 28, "answer": [1], "question": "電腦犯罪中，一點一滴偷取金錢的方法稱為？", "options": {"1": "義大利臘腸技術", "2": "特洛依木馬", "3": "藍領犯罪", "4": "資料騙取。"}, "page": 37}, {"number": 29, "answer": [4], "question": "一部專門用來過濾內外部網路間通訊的電腦稱為？", "options": {"1": "熱站", "2": "疫苗", "3": "冷站", "4": "防火牆。"}, "page": 37}, {"number": 30, "answer": [3], "question": "為了避免硬體的破壞，每一電腦組織應有？", "options": {"1": "生物技術", "2": "編碼標準", "3": "問題發現計劃", "4": "活動標誌組。"}, "page": 37}, {"number": 31, "answer": [1], "question": "所有電腦化系統中最弱的環節為？", "options": {"1": "人", "2": "密碼", "3": "硬體", "4": "軟體。"}, "page": 37}, {"number": 32, "answer": [1], "question": "下列哪一項無法指向「無現金社會」？", "options": {"1": "自動提款機", "2": "信用卡", "3": "編碼晶片", "4": "電子資金轉帳。"}, "page": 37}, {"number": 33, "answer": [3], "question": "下列哪一項不是管制進入電腦系統的措施？", "options": {"1": "名牌", "2": "密碼", "3": "不斷電系統", "4": "門鎖。"}, "page": 37}, {"number": 34, "answer": [4], "question": "「Taiwan-NO.1」是屬於哪一型病毒？", "options": {"1": "檔案型", "2": "開機型", "3": "混合型", "4": "巨集型。"}, "page": 37}, {"number": 35, "answer": [4], "question": "下列有關「防火牆」之敘述，何者不正確？", "options": {"1": "防火牆無法防止內賊對內的侵害，根據經驗，許多入侵或犯罪 行為都是自己人或熟知內部網路佈局的人做的", "2": "防火牆基本上只管制封包的流向，它無法偵測出外界假造的 封包，任何人皆可製造假來源位址的封包", "3": "防火牆無法確保連線的可信度，一但連線涉及外界公眾網路，極 有可能被竊聽或劫奪，除非連線另行加密保護", "4": "防火牆可以防止病毒的入侵。"}, "page": 37}, {"number": 36, "answer": [1], "question": "下列何者是一個用來存放與管理通訊錄及我們在網路上付費的信用卡資料，以確保交易時各項資料的儲存或 傳送時的隱密性與安全性？", "options": {"1": "電子錢包", "2": "商店伺服器", "3": "付款轉接站", "4": "認證中心。"}, "page": 38}, {"number": 37, "answer": [1], "question": "一個成功的安全環境之首要部分是建立什麼？", "options": {"1": "安全政策白皮書", "2": "認證中心", "3": "安全超文字傳輸協定", "4": "BBS。"}, "page": 38}, {"number": 38, "answer": [1], "question": "下列何者不是存取無線網路 AP(Access Point)的安全機制方法？", "options": {"1": "SSID(Service Set Identifier)", "2": "MAC(Media Acce ss Control)Address Control", "3": "WPA(Wi-Fi Protected Access)加密", "4": "WEP(Wired Equivalent Privacy)加密。"}, "page": 38}, {"number": 39, "answer": [4], "question": "目前資訊安全規範的目的，主要是為了保護組織或個人的重要資訊資產，當評鑑所擁有的資訊資產價值時， 下列何者不是必要的評估準則？", "options": {"1": "機密性(Confidentiality)", "2": "完整性(Integrity)", "3": "可用性(Availability)", "4": "弱點性(V ulnerability)。"}, "page": 38}, {"number": 40, "answer": [3], "question": "下列有關於「字典攻擊法」的描述，何者正確？", "options": {"1": "使用字典上有的字來測試密碼", "2": "使用亂數測試密碼", "3": "將常 見的密碼當作字典資料庫來測試密碼", "4": "使用各國語言測試密碼。"}, "page": 38}, {"number": 41, "answer": [2], "question": "下列有關於「在拍賣網站購物時防止詐欺的方法」，何者錯誤？", "options": {"1": "應先仔細閱讀拍賣商品說明，並確認商品 保存狀況", "2": "與賣家私下交易，以獲取較便宜的價格", "3": "可選擇較安全的付費方式", "4": "應先了解買家與賣家相互應 有的責任與義務。"}, "page": 38}, {"number": 42, "answer": [3], "question": "下列有關於「預防手機詐騙」的描述，何者為最適宜的作法？", "options": {"1": "注意是否有來電顯示", "2": "將手機關機", "3": "接到可 疑電話，不隨便依照對方指示去做", "4": "回撥電話給對方以求證是否為手機詐騙。"}, "page": 38}, {"number": 43, "answer": [2], "question": "我的電腦已經安裝了防火牆，所以不需要再安裝防毒軟體？", "options": {"1": "是，不需要重複的功能", "2": "不是，防火牆跟防毒 軟體的主要功能不一樣", "3": "不是，防毒軟體能阻擋垃圾郵件", "4": "是，防毒軟體價格比較貴。"}, "page": 38}, {"number": 44, "answer": [1], "question": "「登入密碼」通常是用來滿足下列哪一項安全性之需求？", "options": {"1": "身分識別(Authentication)", "2": "機密性(Confidentiality)", "3": "不可否認性(Non-repudiation)", "4": "完整性(Integrity)。"}, "page": 38}, {"number": 45, "answer": [4], "question": "企業的可接受風險等級如何決定最恰當？", "options": {"1": "由評鑑的同仁決定", "2": "由臨時開會決定", "3": "由資安公司的資安顧問 建議決定", "4": "事先定義好準則，由管理階層裁定。"}, "page": 38}, {"number": 46, "answer": [3], "question": "「系統在檢查使用者的密碼設定時，會作某些特性的限制或規定」，下列對於這些特性的敘述何者錯誤？", "options": {"1": "密碼有效性", "2": "禁止更新密碼時延用舊密碼", "3": "禁止不同使用者的密碼相同", "4": "密碼必須有一定困難度。"}, "page": 38}, {"number": 47, "answer": [1], "question": "下列有關於「弱點」的描述，何者錯誤？", "options": {"1": "弱點是一種使用者操作上的錯誤或瑕疵", "2": "弱點存在與暴露可能導 致有心人士利用作為入侵途徑", "3": "弱點可能導致程式運作出現非預期結果而造成程式效能上的損失或進一步 的權益損害", "4": "管理員若未能即時取得弱點資訊與修正檔將導致被入侵的可能性增加。"}, "page": 38}, {"number": 48, "answer": [3], "question": "「資訊安全」的三個面向不包含下列何者？", "options": {"1": "機密性(Confidentiality)", "2": "可用性(Availability)", "3": "不可否認性(Non- repudiation)", "4": "完整性(Integrity)。"}, "page": 38}, {"number": 49, "answer": [2], "question": "請問下列哪一個網址有使用 SSL 加密？", "options": {"1": "http://www.security.com/", "2": "https://www.safe.com.tw/", "3": "httpl://www.bank.c om/", "4": "httpd://www.tbank.com.tw/。"}, "page": 38}, {"number": 50, "answer": [4], "question": "下列有關在執行「資料備份」的時候要特別注意的描述，何者是正確而適宜的？", "options": {"1": "電腦有沒有安裝燒錄機", "2": "備份資料時，一定要連防毒軟體一起備份", "3": "網路頻寬速度是不是夠快", "4": "備份資料有沒有中毒。"}, "page": 38}, {"number": 51, "answer": [3], "question": "「社交工程」造成資訊安全極大威脅的原因在於下列何者？", "options": {"1": "破壞資訊服務可用性，使企業服務中斷", "2": "隱匿 性高，不易追查惡意者", "3": "惡意人士不需要具備頂尖的電腦專業技術即可輕易地避過了企業的軟硬體安全防護", "4": "利用通訊埠掃描(Port Scan)方式，無從防範。"}, "page": 38}, {"number": 52, "answer": [4], "question": "為保障電腦資料安全，備份動作是必要的執行措施；下列關於「資料備份」的敘述，何者正確？", "options": {"1": "程式檔案 一定要備份，資料檔案涉及個資不宜備份", "2": "除非正在使用的檔案損毀，否則備份資料檔案絕對不能拿出來使 用", "3": "使用中的檔案與備份資料應該放在一起，便於時常進行備份更新，才能發揮備份效果", "4": "備份資料檔案也 是重要資產，在備份時進行加密是提高資料安全的作法。"}, "page": 38}, {"number": 53, "answer": [4], "question": "下列關於「資訊環保」的敘述，何者有誤?", "options": {"1": "綠色電腦是指從產品的設計、製造、使用到丟棄的過程都符合 環保要求", "2": "能源之星計畫最初是以電腦產品為主，後來擴展至辦公設備與建築", "3": "綠色軟體的特性是不需安裝 或修改系統設定檔便可使用", "4": "危害性物質限制指令(RoHS)，是由美國所制定的一項環保指令，規範工作電壓 小於 1000VAC 或 1500VDC 的電子產品之材料，不得使用鉛、汞、鎘等項化學物質。"}, "page": 38}, {"number": 54, "answer": [4], "question": "下列有關「間諜軟體」的特性描述，何者錯誤？", "options": {"1": "可能會監控你的電腦", "2": "時常偽裝成合法的郵件附加檔四處 散布", "3": "可能會竊取電腦裡的資料", "4": "必須經過你的同意才能安裝。"}, "page": 38}, {"number": 55, "answer": [1], "question": "在啟用 SSL 安全機制的安全認證網站上進行交易，下列描述何者是可確保交易安全的？", "options": {"1": "在交易過程中所 傳輸的資料都是被加密的", "2": "該網站不會將個人資料外流", "3": "該網站的商品價格一定比市價便宜", "4": "該網站不會 被駭客入侵。"}, "page": 39}, {"number": 56, "answer": [4], "question": "下列敘述何者錯誤？", "options": {"1": "跨站指令碼不但影響伺服主機，甚至會導致瀏覽者受害", "2": "SQL injection 是一種攻擊網 站資料庫的手法", "3": "跨目錄存取是因為程式撰寫不良", "4": "存放網頁應用程式的系統安裝最新系統修補程式後，便 不會存有弱點。"}, "page": 39}, {"number": 5 const questions=quizData.sections.flatMap(s=>s.questions.map(q=>({...q,section:s.title,workItem:s.work_item})));
let current=0,score=0,answered=0,results=Array(questions.length).fill(null),selections=Array(questions.length).fill(null);
function answerKey(a){return [...a].sort((x,y)=>x-y).join(',')}
function isMulti(q){return q.answer.length>1}
function render(){const q=questions[current], multi=isMulti(q), result=results[current];document.getElementById('progress').textContent=`題目 ${current+1} / ${questions.length}`;document.getElementById('section').textContent=`${q.workItem}｜${q.section}`;const type=document.getElementById('type');type.textContent=multi?'多選題':'單選題';type.className='tag'+(multi?' multi':'');document.getElementById('score').textContent=`得分：${score}`;document.getElementById('progressBar').style.width=((current+1)/questions.length*100)+'%';document.getElementById('question').textContent=`${q.number}. ${q.question}`;const box=document.getElementById('options');box.innerHTML='';const selected=selections[current]||[];Object.keys(q.options).sort((a,b)=>+a-+b).forEach(k=>{const label=document.createElement('label');label.className='option';label.dataset.n=k;const input=document.createElement('input');input.type=multi?'checkbox':'radio';input.name='answer';input.value=k;input.checked=selected.includes(+k);input.disabled=!!result;if(!result)input.addEventListener('change',()=>multi?saveMulti():checkSingle(+k));const span=document.createElement('span');span.textContent=`${k}. ${q.options[k]}`;label.append(input,span);box.appendChild(label)});document.getElementById('multiActions').classList.toggle('hidden',!multi||!!result);const fb=document.getElementById('feedback');fb.className='feedback';fb.textContent='';if(result){fb.classList.add(result.correct?'ok':'bad');fb.textContent=result.correct?'✓ 答對！':'✗ 答錯！';box.querySelectorAll('.option').forEach(el=>{const n=+el.dataset.n;if(q.answer.includes(n))el.classList.add('correct');else if((selections[current]||[]).includes(n))el.classList.add('wrong')});if(!result.correct)fb.textContent+=` 正確答案：${q.answer.join('、')}`;}document.getElementById('prev').disabled=current===0;document.getElementById('next').textContent=current===questions.length-1?'查看結果':'下一題'}
function saveMulti(){selections[current]=[...document.querySelectorAll('input[name=answer]:checked')].map(x=>+x.value)}
function checkSingle(n){if(results[current])return;selections[current]=[n];const ok=answerKey([n])===answerKey(questions[current].answer);results[current]={correct:ok};score+=ok?1:0;answered++;render()}
function checkMulti(){if(results[current])return;saveMulti();const sel=selections[current]||[];if(!sel.length){alert('請至少選擇一個答案。');return}const ok=answerKey(sel)===answerKey(questions[current].answer);results[current]={correct:ok};score+=ok?1:0;answered++;render()}
function nextQuestion(){if(current===questions.length-1){showResult();return}current++;render();window.scrollTo({top:0,behavior:'smooth'})}
function prevQuestion(){if(current>0){current--;render();window.scrollTo({top:0,behavior:'smooth'})}}
function showResult(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');const unanswered=questions.length-answered;document.getElementById('finalScore').textContent=`${score} / ${questions.length}（${(score/questions.length*100).toFixed(1)}%）`;document.getElementById('finalStats').innerHTML=`<span>答題：${answered}</span><span>答對：${score}</span><span>答錯：${answered-score}</span><span>未答：${unanswered}</span>`;window.scrollTo({top:0,behavior:'smooth'})}
function restartQuiz(){current=0;score=0;answered=0;results=Array(questions.length).fill(null);selections=Array(questions.length).fill(null);document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
